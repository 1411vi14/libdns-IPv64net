# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ published ]

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Install xcaddy
      if: github.event_name == 'release'
      run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

    - name: Build Caddy with IPv64.net
      if: github.event_name == 'release'
      env:
        GOOS: windows
        GOARCH: amd64
      run: "$(go env GOPATH)/bin/xcaddy build --with github.com/1411vi14/libdns-IPv64net=. --output ./caddy-ipv64net.exe"

    - name: Upload Caddy artifact
      if: github.event_name == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: caddy-ipv64net
        path: ./caddy-ipv64net.exe
        if-no-files-found: error

  deploy:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Caddy artifact
      uses: actions/download-artifact@v4
      with:
        name: caddy-ipv64net

    - name: Deploy release asset
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload "$GITHUB_REF_NAME" ./caddy-ipv64net.exe --clobber
